[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-mcp-server"
version = "0.3.2"
description = "OpenStreetMap MCP server: geocoding, routing, isochrones and POI search"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "pytest-cov>=5"]

[project.scripts]
osm-mcp = "osm_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--cov=osm_mcp", "--cov-branch", "--cov-report=term-missing", "--cov-fail-under=100"]

[tool.coverage.run]
branch = true
source = ["src/osm_mcp"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.setuptools.packages.find]
where = ["src"]
