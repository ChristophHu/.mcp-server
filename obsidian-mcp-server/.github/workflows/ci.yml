name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify lockfile and install all groups
        run: |
          uv lock --check
          uv sync --locked --all-groups

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run pyright src tests

      - name: Test with line and branch coverage
        run: uv run pytest -q

      - name: Compile package and tests
        run: uv run python -m compileall -q src tests

      - name: Build distributions
        run: uv build

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Check patch whitespace
        run: git diff --check
